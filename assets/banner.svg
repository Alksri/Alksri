      <animate attributeName="y" from="10" to="0" dur="0.9s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
    </text>

    <text x="0" y="58" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="52" font-weight="700" fill="url(#titleGrad)">
