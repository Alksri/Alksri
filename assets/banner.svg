      <animate attributeName="opacity" from="0" to="1" dur="1.1s" begin="0.45s" fill="freeze"/>
      <animate attributeName="y" from="78" to="58" dur="1.1s" begin="0.45s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
